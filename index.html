<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أحمد × نور ❤️</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff4b72;
      --secondary-color: #ff758c;
      --bg-dark: #0f051d;
      --card-bg: rgba(255, 255, 255, 0.07);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-color: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 5, 29, 0.85);
      z-index: -1;
    }

    /* Login Screen */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .login-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: var(--secondary-color);
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      text-align: center;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .login-box button:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 10px;
      font-size: 14px;
    }

    /* Main App Container */
    #app-container {
      display: none;
      width: 100%;
      max-width: 600px;
      padding-bottom: 80px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    /* Header Profile */
    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary-color);
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
    }

    /* Counter Section */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      margin-top: 15px;
    }

    .counter-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .counter-item span {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: var(--secondary-color);
    }

    .counter-item label {
      font-size: 12px;
      opacity: 0.8;
    }

    /* Dreams Section */
    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--secondary-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dream-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .dream-input-group input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .dream-input-group button {
      padding: 0 15px;
      border-radius: 8px;
      border: none;
      background: var(--primary-color);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .dreams-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
    }

    .dream-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .dream-item.done span {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .dream-actions {
      display: flex;
      gap: 8px;
    }

    .dream-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* Gallery Section */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .gallery-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-btn-container {
      margin-top: 15px;
      text-align: center;
    }

    .upload-btn {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed var(--secondary-color);
      border-radius: 10px;
      cursor: pointer;
      color: var(--secondary-color);
      font-weight: bold;
      transition: background 0.3s;
    }

    .upload-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Audio Player Bar */
    .audio-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background: rgba(15, 5, 29, 0.95);
      border-top: 1px solid var(--border-color);
      padding: 10px 20px;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 99;
      backdrop-filter: blur(10px);
    }

    .audio-bar audio {
      width: 100%;
      max-width: 400px;
      height: 35px;
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h2>أحمد × نور ❤️</h2>
      <p style="margin-bottom: 15px; font-size: 14px; opacity: 0.8;">أدخل كلمة المرور لدخول حكايتنا</p>
      <input type="password" id="pass-input" placeholder="كلمة المرور">
      <button id="login-btn">افتح حكايتنا ❤️</button>
      <div id="login-error" class="error-msg"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-container">
    
    <!-- Status & Info Container -->
    <div class="container">
      <div class="status-bar">
        <span>حالة Firebase: <strong id="firebase-status">جاري الاتصال...</strong></span>
      </div>

      <div class="profile-header">
        <img src="avatar.jpg" alt="Ahmed & Nour" class="avatar">
        <h2>أحمد × نور ❤️</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-top: 5px;">قصة حب تبدأ ولا تنتهي</p>
      </div>

      <!-- Counter -->
      <div class="section-title">⏳ حكايتنا بدأت منذ:</div>
      <div class="counter-grid">
        <div class="counter-item"><span id="years">0</span><label>سنة</label></div>
        <div class="counter-item"><span id="months">0</span><label>شهر</label></div>
        <div class="counter-item"><span id="days">0</span><label>يوم</label></div>
        <div class="counter-item"><span id="hours">0</span><label>ساعة</label></div>
        <div class="counter-item"><span id="minutes">0</span><label>دقيقة</label></div>
        <div class="counter-item"><span id="seconds">0</span><label>ثانية</label></div>
      </div>
    </div>

    <!-- Dreams Container -->
    <div class="container">
      <div class="section-title">🌙 أحلامنا</div>
      <div class="dream-input-group">
        <input type="text" id="dream-text" placeholder="اكتب حلماً جديداً...">
        <button id="add-dream-btn">إضافة</button>
      </div>
      <ul id="dreams-list" class="dreams-list">
        <!-- Dreams will load here -->
      </ul>
    </div>

    <!-- Gallery Container -->
    <div class="container">
      <div class="section-title">📸 معرضنا</div>
      <div class="gallery-grid" id="gallery-grid">
        <!-- Static Images -->
        <div class="gallery-item"><img src="img1.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img2.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img3.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img4.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img5.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img6.jpg" alt="Memory"></div>
        <div class="gallery-item"><img src="img7.jpg" alt="Memory"></div>
        <!-- Dynamic Images from Firestore will render here -->
      </div>
      <div class="upload-btn-container">
        <label class="upload-btn">
          ＋ أضف صورة من الموبايل
          <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
        </label>
      </div>
    </div>

  </div>

  <!-- Audio Bar -->
  <div class="audio-bar" id="audio-bar">
    <audio id="bg-audio" controls loop src="song.mp3"></audio>
  </div>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    let db = null;
    let auth = null;

    // Login logic - Works instantly without waiting for Firebase
    document.getElementById('login-btn').addEventListener('click', () => {
      const pass = document.getElementById('pass-input').value;
      const errorDiv = document.getElementById('login-error');
      
      if (pass === 'love') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        document.getElementById('audio-bar').style.display = 'flex';
        
        // Start Counter
        startCounter();

        // Try playing audio (may require interaction)
        const audio = document.getElementById('bg-audio');
        audio.play().catch(e => console.log("Audio autoplay restricted:", e));

        // Initialize Firebase in background
        initFirebaseBackground();
      } else {
        errorDiv.textContent = 'كلمة المرور غير صحيحة ❤️';
      }
    });

    // Enter key support for login
    document.getElementById('pass-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    async function initFirebaseBackground() {
      const statusEl = document.getElementById('firebase-status');
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        await signInAnonymously(auth);
        statusEl.textContent = "🟢 متصل";
        statusEl.style.color = "#4cd137";

        // Setup real-time listeners
        setupDreamsListener();
        setupGalleryListener();

      } catch (e) {
        console.error("Firebase initialization error:", e);
        console.error("Error Code:", e.code);
        console.error("Error Message:", e.message);
        statusEl.textContent = "🟡 غير متصل (خطأ في الاتصال)";
        statusEl.style.color = "#fbc531";
      }
    }

    // Counter Implementation
    function startCounter() {
      const startDate = new Date("2026-09-19T06:08:00+03:00");

      function update() {
        const now = new Date();
        const diff = now - startDate;

        if (diff < 0) return;

        const seconds = Math.floor((diff / 1000) % 60);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const daysTotal = Math.floor(diff / (1000 * 60 * 60 * 24));

        // Approximation for years, months, days
        const years = Math.floor(daysTotal / 365);
        const months = Math.floor((daysTotal % 365) / 30);
        const days = (daysTotal % 365) % 30;

        document.getElementById('years').textContent = years;
        document.getElementById('months').textContent = months;
        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = hours;
        document.getElementById('minutes').textContent = minutes;
        document.getElementById('seconds').textContent = seconds;
      }

      update();
      setInterval(update, 1000);
    }

    // Dreams Logic
    function setupDreamsListener() {
      try {
        const q = query(collection(db, "couples/ahmed-nour-2026/dreams"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
          const listEl = document.getElementById('dreams-list');
          listEl.innerHTML = '';
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            
            const li = document.createElement('li');
            li.className = `dream-item ${data.done ? 'done' : ''}`;
            li.innerHTML = `
              <span>${escapeHtml(data.text || '')}</span>
              <div class="dream-actions">
                <button onclick="toggleDream('${id}', ${!data.done})">${data.done ? '❌' : '✔️'}</button>
                <button onclick="deleteDream('${id}')">🗑️</button>
              </div>
            `;
            listEl.appendChild(li);
          });
        }, (error) => {
          console.error("Dream listener error:", error.code, error.message);
        });
      } catch (e) {
        console.error("Firestore error (dreams setup):", e.code, e.message);
      }
    }

    document.getElementById('add-dream-btn').addEventListener('click', async () => {
      const input = document.getElementById('dream-text');
      const text = input.value.trim();
      if (!text || !db) return;

      try {
        await addDoc(collection(db, "couples/ahmed-nour-2026/dreams"), {
          text: text,
          done: false,
          createdAt: serverTimestamp()
        });
        input.value = '';
      } catch (e) {
        console.error("Firestore error (add dream):", e.code, e.message);
        alert("فشل إضافة الحلم، تأكد من اتصال الإنترنت أو الصلاحيات.");
      }
    });

    window.toggleDream = async function(id, newStatus) {
      if (!db) return;
      try {
        await updateDoc(doc(db, "couples/ahmed-nour-2026/dreams", id), {
          done: newStatus
        });
      } catch (e) {
        console.error("Firestore error (update dream):", e.code, e.message);
      }
    };

    window.deleteDream = async function(id) {
      if (!db) return;
      try {
        await deleteDoc(doc(db, "couples/ahmed-nour-2026/dreams", id));
      } catch (e) {
        console.error("Firestore error (delete dream):", e.code, e.message);
      }
    };

    // Gallery & Image Compression Logic
    function setupGalleryListener() {
      try {
        const q = query(collection(db, "couples/ahmed-nour-2026/gallery"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
          const gridEl = document.getElementById('gallery-grid');
          // Keep static images first, clear dynamic ones or rebuild
          // To keep it simple, let's retain static ones and append/update dynamic ones
          // Or re-render dynamic container parts. Let's select dynamic items container or clear grid and keep static.
          
          // Let's preserve static items by keeping them or re-adding them:
          const staticHTML = `
            <div class="gallery-item"><img src="img1.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img2.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img3.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img4.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img5.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img6.jpg" alt="Memory"></div>
            <div class="gallery-item"><img src="img7.jpg" alt="Memory"></div>
          `;
          let dynamicHTML = '';
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data.data) {
              dynamicHTML += `<div class="gallery-item"><img src="${data.data}" alt="Uploaded Memory"></div>`;
            }
          });
          gridEl.innerHTML = staticHTML + dynamicHTML;
        }, (error) => {
          console.error("Gallery listener error:", error.code, error.message);
        });
      } catch (e) {
        console.error("Firestore error (gallery setup):", e.code, e.message);
      }
    }

    document.getElementById('image-upload-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !db) return;

      // Compress image to Base64 to fit safely within Firestore limits (< 1MB document limit)
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Compress to JPEG with 0.7 quality to keep size well under Firestore's 1MB limit
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

          try {
            await addDoc(collection(db, "couples/ahmed-nour-2026/gallery"), {
              data: compressedDataUrl,
              name: file.name,
              createdAt: serverTimestamp()
            });
          } catch (err) {
            console.error("Firestore error (upload image):", err.code, err.message);
            alert("حجم الصورة كبير جداً أو حدث خطأ في الرفع.");
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
